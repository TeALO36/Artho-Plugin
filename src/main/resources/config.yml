tips-enabled: true

# The donation link
donation-link: "https://buy.stripe.com/14k8Al4ki5tl8HmfZb"

# Messages to broadcast. %link% will be replaced by the donation link.
# Supports color codes with &
messages:
  - "&d&lArthoNetwork &7» &fSoutenez le serveur : &d$link"
  - "&d&lArthoNetwork &7» &fEnvie d'aider ? Faites un don : &d$link"
  - "&a[ArthoNetwork] &2Les serveurs ne sont pas gratuits, &aaidez-nous ! &b$link"
  - "&c[ArthoNetwork] &4Un petit geste pour le serveur ? &c$link"
  - "&9[ArthoNetwork] &3Participez à l'aventure en nous soutenant : &b$link"
  - "&5[ArthoNetwork] &dMerci de votre fidélité ! &5Dons : &d$link"
  - "&eASTUCE &7» &fUtilisez &e/sethome <nom> &fpour sauvegarder un endroit !"
  - "&eASTUCE &7» &fTapez &e/homes &fpour voir vos points de téléportation."
  - "&eASTUCE &7» &fBesoin de rejoindre un ami ? Faites &e/tpa <joueur> &f!"

